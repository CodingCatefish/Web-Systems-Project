# Example Apache settings for production deployments behind HTTPS.
# Adjust the proxy IP range and certificate paths for your environment.

<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

# If Apache sits behind a trusted reverse proxy, only preserve the original
# scheme for requests that actually arrive from that proxy. Replace the sample
# CIDRs below with the exact proxy IPs or networks for your environment.
<IfModule mod_setenvif.c>
    SetEnvIfExpr "-R '10.0.0.0/8' && req('X-Forwarded-Proto') =~ /^https$/i" HTTPS=on
    SetEnvIfExpr "-R '172.16.0.0/12' && req('X-Forwarded-Proto') =~ /^https$/i" HTTPS=on
    SetEnvIfExpr "-R '192.168.0.0/16' && req('X-Forwarded-Proto') =~ /^https$/i" HTTPS=on
</IfModule>

# Production deployments should also block direct public access to Apache so
# untrusted clients cannot send spoofed forwarding headers to the origin.
